plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

// The 26.x sources (platform/mc26/java, renamed below) plus platform/mc1.21.1/.
def root = file('..')
def rootProps = new Properties()
new File(root, 'gradle.properties').withInputStream { rootProps.load(it) }

version = "${rootProps.mod_version}+mc1.21.1"
group = rootProps.maven_group

base {
    archivesName = rootProps.archives_base_name
}

sourceSets.main {
    java.srcDirs = [layout.buildDirectory.dir('generated/mc26-for-1.21.1').get().asFile, new File(root, 'platform/mc1.21.1/java')]
    resources.srcDirs = [new File(root, 'src/main/resources'), new File(root, 'platform/mc1.21.1/resources')]
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

// Keycaps is written once for 26.x (platform/mc26/java). 1.21.1 has most of the GUI code under older names, so
// the sources are copied here with these renames (Minecraft 26.1 renamed GuiGraphics to GuiGraphicsExtractor
// and its render methods to extract..., Fabric API renamed KeyBindingHelper and Screens' methods).
// What differs otherwise is in platform/mc1.21.1/java (Compat).
def mc26Renames = [
    'super.extractRenderState('      : 'super.render(',
    'public void extractRenderState(': 'public void render(',
    'GuiGraphicsExtractor'           : 'GuiGraphics',
    'g.text('                        : 'g.drawString(',
    'g.centeredText('                : 'g.drawCenteredString(',
    'g.outline('                     : 'g.renderOutline(',
    'Screens.getWidgets('            : 'Screens.getButtons(',
    'net.fabricmc.fabric.api.client.keymapping.v1.KeyMappingHelper': 'net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper',
    'KeyMappingHelper.registerKeyMapping(' : 'KeyBindingHelper.registerKeyBinding(',
    'KeyMappingHelper.'              : 'KeyBindingHelper.',
    // 1.21.1 only: Identifier was ResourceLocation, and the input methods took plain values (small records
    // named KeyEvent and MouseButtonEvent in platform/mc1.21.1/java stand in for 1.21.9's events)
    'import net.minecraft.resources.Identifier;'          : 'import net.minecraft.resources.ResourceLocation;',
    'Identifier'                                          : 'ResourceLocation',
    'import net.minecraft.client.input.KeyEvent;'         : 'import io.github.hiveko.keycaps.screen.KeyEvent;',
    'import net.minecraft.client.input.MouseButtonEvent;' : 'import io.github.hiveko.keycaps.screen.MouseButtonEvent;',
    'public boolean mouseClicked(MouseButtonEvent event, boolean doubleClick) {':
        'public boolean mouseClicked(double eventX, double eventY, int eventButton) { MouseButtonEvent event = new MouseButtonEvent(eventX, eventY, eventButton); boolean doubleClick = false;',
    'super.mouseClicked(event, doubleClick)'              : 'super.mouseClicked(event.x(), event.y(), event.button())',
    'public boolean keyPressed(KeyEvent event) {':
        'public boolean keyPressed(int eventKey, int eventScancode, int eventModifiers) { KeyEvent event = new KeyEvent(eventKey, eventScancode, eventModifiers);',
    'super.keyPressed(event)'                             : 'super.keyPressed(event.key(), event.scancode(), event.modifiers())',
]
def mc26Sources = tasks.register('mc26Sources', Copy) {
    from(new File(root, 'platform/mc26/java'))
    into(layout.buildDirectory.dir('generated/mc26-for-1.21.1'))
    inputs.property('renames', mc26Renames.toString())
    filter { String line -> mc26Renames.inject(line) { l, e -> l.replace(e.key, e.value) } }
}
tasks.named('compileJava') { dependsOn mc26Sources }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    def props = [version: project.version, minecraft_range: project.minecraft_range,
                 loader_min: project.loader_min, java_version: '21']
    inputs.properties props
    filesMatching("fabric.mod.json") { expand props }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

jar {
    from(new File(root, 'LICENSE')) {
        rename { "${it}_${rootProps.archives_base_name}" }
    }
}
